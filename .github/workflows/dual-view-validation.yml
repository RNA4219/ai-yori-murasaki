name: dual-view validation
on:
  push:
    branches:
      - docs/dual-view-requirements-20261116
  pull_request:
    paths:
      - "ai_yori_murasaki/**"
      - "decision_view/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/dual-view-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Full Python regression
        run: python -m pytest -q tests/ decision_view/tests/test_aym_decision_view.py
      - name: All decision-view JavaScript tests
        run: node --test decision_view/tests/*.mjs

      - name: Install Chromium for real UI acceptance
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Browser smoke at 1440px and 390px
        run: |
          python tests/fixtures/dual_view_browser_server.py > /tmp/aym-browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/api/health > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then cat /tmp/aym-browser-server.log; exit 1; fi
          node decision_view/browser/dual-view.browser.mjs
          node tests/browser/workspace.browser.mjs
          node tests/browser/architecture-switch.browser.mjs
