[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-rust>=1.11,<2"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-yori-murasaki"
version = "0.1.1"
description = "Offline Blue/Purple contracts, evidence and deterministic Oracle"
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.26.0", "jsonschema-rs==0.61.2", "ijson==3.6.0", "referencing==0.37.0", "cvss==3.6", "packaging==26.0"]

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]

[project.scripts]
aym = "ai_yori_murasaki.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "rust/intake/THIRD_PARTY_LICENSES.txt"]

[tool.setuptools.packages.find]
include = ["ai_yori_murasaki*"]

[[tool.setuptools-rust.ext-modules]]
target = "ai_yori_murasaki._intake_index"
path = "rust/intake/Cargo.toml"
cargo-manifest-args = ["--locked"]

[tool.setuptools.package-data]
"ai_yori_murasaki.web.architecture" = ["*.mjs", "sample.json", "product.json", "js-yaml.LICENSE"]
ai_yori_murasaki = ["schemas/v1/*.json", "web/*.html", "web/decision-sample.json", "decision_mapping.json", "lab_assets/*.py", "lab_assets/Dockerfile", "default-policy.json", "adapters/contracts/*.json", "assessment_assets/*.py", "assessment_assets/Dockerfile", "agents/policies_default.json", "scenarios/*/target.py", "scenarios/*/scenario.json", "scenarios/*/files/*.txt"]
