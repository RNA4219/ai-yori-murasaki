<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$heading | AI YORI MURASAKI</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #fff;
    --card: #fff;
    --ink: #191d27;
    --muted: #485163;
    --edge: #8290a5;
    --accent: #214fc4;
    --action: #171c29;
    --action-hover: #2e3850;
    --action-edge: var(--action);
    --focus: #164ece;
  }
  * { box-sizing: border-box; }
  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
    min-height: 100svh;
    margin: 0;
    padding: 32px 20px;
    color: var(--ink);
    background: var(--page);
    font: 1rem/1.6 "Noto Sans JP", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
  }
  main {
    width: min(100%, 440px);
    min-width: 0;
    padding: 32px clamp(16px, 6vw, 40px) 24px;
    background: var(--card);
    border: 1px solid var(--edge);
    border-top: .35rem solid var(--accent);
    border-radius: .5rem;
    overflow-wrap: anywhere;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 0 0 22px;
    color: var(--muted);
    font-size: .75rem;
    font-weight: 700;
    letter-spacing: .14em;
  }
  .brand-stamp {
    display: grid;
    place-items: center;
    flex: none;
    width: 1.65rem;
    height: 1.65rem;
    border-radius: .3rem;
    background: #c5d8ff;
    color: #171c29;
    font: 700 1.125rem/1 "Yu Mincho", "Hiragino Mincho ProN", serif;
    letter-spacing: normal;
  }
  h1 {
    margin: 0;
    font-size: clamp(1.55rem, 1.1rem + 1.65vw, 2.65rem);
    line-height: 1.35;
    text-wrap: balance;
  }
  .message {
    margin: 10px 0 24px;
    color: var(--muted);
    font-size: clamp(.875rem, .8125rem + .25vw, 1rem);
    line-height: 1.8;
    text-wrap: balance;
  }
  .google-login {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    min-height: 50px;
    padding: 10px 16px;
    color: #fff;
    background: var(--action);
    border: 1px solid var(--action-edge);
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 600;
    text-decoration: none;
  }
  .google-login svg {
    flex: none;
    width: 26px;
    height: 26px;
    padding: 4px;
    border-radius: 50%;
    background: #fff;
  }
  .google-login:is(:hover, :active) { background: var(--action-hover); }
  .google-login:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  @media (max-width: 380px) {
    body { padding: 16px 12px; }
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #14171e;
      --card: #1e222c;
      --ink: #f0f1f3;
      --muted: #c0c4ce;
      --edge: #626b7b;
      --accent: #a6c3ff;
      --action-edge: #8290a5;
      --focus: #9ea2ff;
    }
  }
  @media (forced-colors: active) {
    main { border-color: CanvasText; }
    .brand-stamp { border: 1px solid CanvasText; }
    .google-login { color: LinkText; border-color: LinkText; }
    .google-login:focus-visible { outline-color: Highlight; }
  }
</style>
</head>
<body>
<main>
  <p class="brand"><span class="brand-stamp" aria-hidden="true">紫</span> AI YORI MURASAKI</p>
  <h1>$heading</h1>
  <p class="message">$message</p>
  <a class="google-login" href="$login_url">
    <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59A14.36 14.36 0 0 1 9.78 24c0-1.59.27-3.13.75-4.59l-7.98-6.19A23.8 23.8 0 0 0 0 24c0 3.87.93 7.52 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.91-5.82l-7.73-6c-2.15 1.45-4.92 2.32-8.18 2.32-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    Google でログイン
  </a>
</main>
</body>
</html>
