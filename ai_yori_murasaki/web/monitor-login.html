<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$heading | AI YORI MURASAKI</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #fff;
    --card: #fff;
    --ink: #08131a;
    --muted: #51636d;
    --edge: #e2e9ed;
    --wash: rgb(90 200 184 / 14%);
    --action: #08131a;
    --action-hover: #233640;
    --action-edge: #08131a;
    --focus: #3650ae;
    --shadow: rgb(8 19 26 / 9%);
  }
  * { box-sizing: border-box; }
  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
    min-height: 100svh;
    margin: 0;
    padding: 32px 20px;
    color: var(--ink);
    background: radial-gradient(ellipse 560px 300px at 50% 0, var(--wash), transparent 72%), var(--page);
    font: 1rem/1.6 "Segoe UI", "Yu Gothic UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
  }
  main {
    width: min(100%, 440px);
    min-width: 0;
    padding: 44px 40px 32px;
    background: var(--card);
    border: 1px solid var(--edge);
    border-radius: 18px;
    box-shadow: 0 20px 45px var(--shadow);
    overflow-wrap: anywhere;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 0 0 22px;
    color: var(--muted);
    font-size: .75rem;
    font-weight: 700;
    letter-spacing: .14em;
  }
  .brand::before {
    content: "";
    flex: 0 0 11px;
    height: 11px;
    border-radius: 3px;
    background: #5ac8b8;
  }
  h1 { margin: 0; font-size: 1.6875rem; line-height: 1.4; text-wrap: balance; }
  .message {
    margin: 10px 0 28px;
    color: var(--muted);
    font-size: .9375rem;
    line-height: 1.8;
    text-wrap: balance;
  }
  .google-login {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    min-height: 48px;
    padding: 10px 16px;
    color: #fff;
    background: var(--action);
    border: 1px solid var(--action-edge);
    border-radius: 999px;
    font-size: .9375rem;
    font-weight: 600;
    text-decoration: none;
  }
  .google-login svg {
    flex: none;
    width: 26px;
    height: 26px;
    padding: 4px;
    border-radius: 50%;
    background: #fff;
  }
  .google-login:is(:hover, :active) { background: var(--action-hover); }
  .google-login:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  @media (max-width: 380px) {
    body { padding: 16px 12px; }
    main { padding: 30px 20px 24px; border-radius: 14px; }
    h1 { font-size: 1.375rem; }
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #08131a;
      --card: #10222c;
      --ink: #edf4f5;
      --muted: #b0c2cb;
      --edge: #2b4250;
      --wash: rgb(90 200 184 / 10%);
      --action: #08131a;
      --action-hover: #1d3441;
      --action-edge: #6f8692;
      --focus: #a6b7ff;
      --shadow: rgb(0 0 0 / 30%);
    }
  }
  @media (forced-colors: active) {
    main { border-color: CanvasText; }
    .brand::before { border: 1px solid CanvasText; }
    .google-login { color: LinkText; border-color: LinkText; }
    .google-login:focus-visible { outline-color: Highlight; }
  }
</style>
</head>
<body>
<main>
  <p class="brand">AI YORI MURASAKI</p>
  <h1>$heading</h1>
  <p class="message">$message</p>
  <a class="google-login" href="$login_url">
    <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59A14.36 14.36 0 0 1 9.78 24c0-1.59.27-3.13.75-4.59l-7.98-6.19A23.8 23.8 0 0 0 0 24c0 3.87.93 7.52 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.91-5.82l-7.73-6c-2.15 1.45-4.92 2.32-8.18 2.32-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    Google でログイン
  </a>
</main>
</body>
</html>
